name: Daily articles

on:
  schedule:
    # 05:30 UTC every day (06:30/07:30 UK depending on season)
    - cron: '30 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out gh-pages (the deployed site, where the feed lives)
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Fetch the generator script from main
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- scripts/generate-packs.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate study packs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-packs.mjs

      - name: Commit the updated feed
        run: |
          git config user.name 'tinta-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm --cached scripts/generate-packs.mjs --ignore-unmatch -q || true
          rm -f scripts/generate-packs.mjs
          if git diff --quiet -- feed/index.json; then
            echo 'No feed changes.'
          else
            git add feed/index.json
            git commit -m "feed: daily packs $(date -u +%F)"
            git push origin gh-pages
          fi
